name: Aderyn Audit

on:
  workflow_dispatch:
  push:

jobs:
  aderyn:
    name: Cyfrin Aderyn static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Install solc 0.8.24
        run: |
          pip install --user solc-select
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Use solc 0.8.24
        run: |
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Download Aderyn
        run: |
          curl -sSL https://github.com/cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz -o aderyn.tar.xz
          tar -xJf aderyn.tar.xz
          mv aderyn-x86_64-unknown-linux-gnu/aderyn ./aderyn
          chmod +x ./aderyn

      - name: Run Aderyn
        run: ./aderyn contracts/ --output aderyn-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-report
          path: aderyn-report.md
          retention-days: 30

      - name: Report summary
        if: always()
        run: |
          echo "## Aderyn Report" >> $GITHUB_STEP_SUMMARY
          cat aderyn-report.md >> $GITHUB_STEP_SUMMARY
